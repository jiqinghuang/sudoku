<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数独逐步解 · Sudoku Step Solver</title>
<style>
:root{
  --bg:#f3f6fb; --panel:#ffffff; --panel2:#f8fafc; --line:#e3e9f2; --line2:#cdd8e8;
  --txt:#1e293b; --dim:#64748b;
  --acc:#2f6fed; --acc2:#1d4ed8; --acc-soft:#e8f0fe;
  --ok:#0b8a55; --ok-soft:#e4f7ee;
  --warn:#b45309; --warn-soft:#fdf1df;
  --err:#dc2626; --err-soft:#fdecec;
  --cell:min(50px,calc((100vw - 500px)/9));
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 32px -16px rgba(15,23,42,.25);
}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);
  background:
    radial-gradient(1100px 480px at 12% -12%, #e4eeff 0%, rgba(228,238,255,0) 60%),
    radial-gradient(900px 420px at 92% -6%, #e6f6ef 0%, rgba(230,246,239,0) 55%),
    var(--bg);
  background-attachment:fixed;
  font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
header{padding:13px 22px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
header h1::before{content:"";width:11px;height:11px;border-radius:3px;
  background:linear-gradient(135deg,var(--acc),#7aa8ff);box-shadow:0 2px 6px rgba(47,111,237,.35)}
header .sp{flex:1}
.tag{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:#fff;transition:background .2s,color .2s}
.tag.ok{color:var(--ok);border-color:#bfe6d2;background:var(--ok-soft)}
.tag.err{color:var(--err);border-color:#f3c1c1;background:var(--err-soft)}
.tag.warn{color:var(--warn);border-color:#f0d9b0;background:var(--warn-soft)}
.wrap{display:flex;gap:26px;padding:24px;align-items:flex-start;flex-wrap:wrap}
.left{flex:0 0 auto;width:calc(var(--cell)*9 + 16px);display:flex;flex-direction:column;gap:14px}
.right{flex:1 1 340px;min-width:320px;display:flex;flex-direction:column;gap:16px}

/* ---------- grid ---------- */
.board{display:grid;grid-template-columns:repeat(9,var(--cell));grid-template-rows:repeat(9,var(--cell));
  background:var(--line2);gap:1px;border:2px solid #a9b8cd;border-radius:12px;overflow:hidden;user-select:none;
  box-shadow:var(--shadow)}
.cell{background:#fff;display:flex;align-items:center;justify-content:center;position:relative;
  cursor:pointer;font-size:21px;font-weight:600;color:#334155;transition:background .12s}
.cell:hover{background:#eef4ff}
.cell.bR{border-right:2px solid #a9b8cd}
.cell.bB{border-bottom:2px solid #a9b8cd}
.cell.given{background:#edf1f7;color:#0f172a;font-weight:700}
.cell.given:hover{background:#e3eaf4}
.cell.stepped{background:var(--ok-soft);color:var(--ok)}
.cell.guess{background:var(--warn-soft);color:var(--warn)}
.cell.bad{background:var(--err-soft);color:var(--err)}
.cell.peer{background:#f2f6ff}
.cell.hl-unit{background:#edf3ff}
.cell.elim{background:#fff3df;color:var(--warn)}
.cell.same{background:#dbe8ff;color:var(--acc2)}
.cell.sel{outline:2px solid var(--acc);outline-offset:-2px;z-index:2}
.cell.hl-focus{box-shadow:inset 0 0 0 2px #f59e0b}
.cell.cur{outline:3px solid #f59e0b;outline-offset:-2px;z-index:3;
  box-shadow:inset 0 0 0 1px rgba(245,158,11,.25)}
.cell .v{line-height:1;pointer-events:none}
.cell .cands{position:absolute;inset:2px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  font-size:9.5px;font-weight:600;color:#93a3b8;pointer-events:none}
.cell .cands i{font-style:normal;display:flex;align-items:center;justify-content:center}
.cell .cands i.g{color:var(--acc)}
.cell .cands i.pick{color:#0b8a55;font-weight:800;background:#e4f7ee;border-radius:3px}
.cell .cands i.strike{color:#dc2626;text-decoration:line-through;text-decoration-thickness:1.5px}
.cell.elim-hit{animation:flash .6s}
@keyframes flash{0%{background:#ffe9c7}100%{background:#fff}}
.badge{position:absolute;top:0;right:0;width:12px;height:12px;line-height:12px;text-align:center;border-radius:50%;
  background:#fff;color:#c2410c;font-size:9px;font-weight:700;box-shadow:0 0 0 1px #f0c987;pointer-events:none}
.badge:empty{display:none}

/* ---------- controls ---------- */
.playbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:#fff;color:var(--txt);border:1px solid var(--line2);border-radius:10px;
  padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;
  box-shadow:0 1px 2px rgba(15,23,42,.05);
  transition:background .12s,border-color .12s,box-shadow .12s,transform .06s}
button:hover:not(:disabled){background:#f5f8ff;border-color:#b9c9e4;box-shadow:0 2px 8px rgba(47,111,237,.14)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:linear-gradient(180deg,#3b7bf6,#2f6fed);border-color:#2f6fed;color:#fff;
  padding:9px 18px;font-weight:600;box-shadow:0 2px 10px rgba(47,111,237,.35)}
button.pri:hover:not(:disabled){background:linear-gradient(180deg,#4a87f8,#3b7bf6);border-color:#3b7bf6}
.navgrp{display:inline-flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.navgrp button{border:none;background:transparent;box-shadow:none;padding:6px 11px;border-radius:9px}
.navgrp button:hover:not(:disabled){background:#e8f0fe;border-color:transparent;box-shadow:none}
.spd{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);margin-left:auto;padding-right:4px}
.pad{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.pad button{padding:12px 0;font-size:16.5px;font-weight:700;border-radius:10px}
.pad button:last-child{color:var(--err);border-color:#f0c8c8;background:#fffafa}
.pad button:last-child:hover:not(:disabled){background:#fdeeee;border-color:#eeb8b8}
.pastebar{display:flex;gap:8px}
.pastebar input{flex:1;width:auto;min-width:0}
.genbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.genbar button{padding:9px 0;font-weight:600}
.tip{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:10px}
.chk{display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--txt)}
.chk label{display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=range]{width:110px;vertical-align:middle;accent-color:var(--acc)}
input[type=text]{background:#fff;border:1px solid var(--line2);color:var(--txt);border-radius:10px;
  padding:8px 12px;font:inherit;font-size:12.5px;font-family:Consolas,monospace;
  transition:border-color .12s,box-shadow .12s}
input[type=text]:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,111,237,.15)}

/* ---------- panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow)}
.card>h2{margin:0;padding:10px 15px;font-size:12px;font-weight:600;color:var(--dim);
  border-bottom:1px solid var(--line);background:var(--panel2);letter-spacing:.4px;
  display:flex;justify-content:space-between;align-items:center}
.card .body{padding:13px 15px}
#diag{font-size:12.5px;white-space:pre-wrap;line-height:1.7}
#diag .s{display:flex;gap:7px;align-items:flex-start;margin-bottom:5px}
#diag .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--dim)}
#diag .ok .dot{background:var(--ok)} #diag .bad .dot{background:var(--err)}
#diag .warn .dot{background:#f59e0b} #diag .info .dot{background:var(--acc)}
#reason{min-height:76px;max-height:min(46vh,440px);overflow-y:auto;font-size:13px;line-height:1.8}
#reason::-webkit-scrollbar{width:8px}
#reason::-webkit-scrollbar-thumb{background:#d5deeb;border-radius:4px}
#reason .t{font-size:11px;color:var(--dim);margin-bottom:6px}
#reason .tech{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;margin-right:6px;
  background:var(--acc-soft);color:var(--acc2);font-weight:600}
#reason .tech.guess{background:var(--warn-soft);color:var(--warn)}
#reason .pos{font-family:Consolas,monospace;color:var(--txt);font-weight:600}
#reason .val{font-weight:700;color:var(--ok)} #reason .val.g{color:var(--warn)}
#reason .mv{border-top:1px dashed var(--line);margin-top:9px;padding-top:9px}
#reason .mvh{display:flex;align-items:center;gap:7px;margin-bottom:4px}
#reason .idx{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  background:var(--acc-soft);color:var(--acc2);font-size:11px;font-weight:700;flex:0 0 auto}
#reason .mvr{font-size:12.5px;color:#475569}
#reason .lgd{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#reason .lg{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line2)}
#reason .lg.u{background:#edf3ff;border-color:#c7d8f7}
#reason .lg.f{background:#fff;border:2px solid #f59e0b}
#reason .lg.s{background:#fff3df;border-color:#f0c987}
.steps{max-height:min(46vh,420px);overflow-y:auto}
.steps::-webkit-scrollbar{width:8px}
.steps::-webkit-scrollbar-thumb{background:#d5deeb;border-radius:4px}
.steps::-webkit-scrollbar-thumb:hover{background:#bcc9dc}
.steps ol{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:8px;align-items:baseline;padding:5px 15px;cursor:pointer;font-size:12px;
  border-bottom:1px solid #f1f5f9;transition:background .1s}
.steps li:last-child{border-bottom:none}
.steps li:hover{background:#f6f9ff}
.steps li.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.steps li.past{color:#9aa8bc}
.steps li .n{flex:0 0 34px;text-align:right;color:#9aa8bc;font-family:Consolas,monospace;font-size:11px}
.steps li .k{flex:0 0 auto;font-size:10px;padding:0 6px;border-radius:999px;background:#eef2f8;color:#64748b}
.steps li.g .k{background:var(--warn-soft);color:var(--warn)}
.steps li.e .k{background:#f3e8ff;color:#7c3aed}
.steps li.m .k{background:#eef2ff;color:#4f46e5}
.steps li .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:18px 15px;color:var(--dim);font-size:12px;text-align:center}
.hint{font-size:11.5px;color:var(--dim);line-height:1.9;padding:9px 15px;border-top:1px solid var(--line);background:#fbfcfe}
.hint kbd{background:#fff;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;
  padding:0 5px;font-family:Consolas,monospace;font-size:11px;color:#475569}
@media(max-width:940px){:root{--cell:min(9.5vw,50px)}}
@media(max-width:820px){.right{min-width:100%}}
</style>
</head>

<body>

<header>
  <h1>数独 · 逐步解</h1>
  <span class="tag" id="tVer">确定性推理 · 中文详解 · 可前进/后退</span>
  <span class="sp"></span>
  <span class="tag" id="tState">未解题</span>
</header>

<div class="wrap">
  <div class="left">
    <div class="board" id="board"></div>

    <div class="playbar">
      <button class="pri" id="bSolve">求解 / 生成步骤</button>
      <span class="navgrp">
        <button id="bFirst" title="回到开头">⏮</button><button id="bPrev" title="上一步">◀</button>
        <button id="bNext" title="下一步">▶</button><button id="bLast" title="跳到最后">⏭</button>
      </span>
      <button id="bPlay">▶ 自动</button>
      <label class="spd">速度<input type="range" id="spd" min="1" max="10" value="6"></label>
    </div>

    <div class="card">
      <h2>输入数字</h2>
      <div class="body">
        <div class="pad" id="pad"></div>
        <div class="tip">先点棋盘选中一格，再用键盘 <b>1–9</b> 或上面的按钮填数；<b>清除</b> 删除所选格。已知数字填好后点「求解」。</div>
      </div>
    </div>

    <div class="card">
      <h2>载入谜面</h2>
      <div class="body pastebar">
        <input type="text" id="paste" placeholder="粘贴 81 字符谜面（0 / . / - 为空）">
        <button id="bPaste">载入</button>
        <button id="bClr">清空棋盘</button>
      </div>
    </div>

    <div class="card">
      <h2>随机出题</h2>
      <div class="body">
        <div class="genbar">
          <button data-gen="40">简单</button><button data-gen="34">中等</button>
          <button data-gen="28">困难</button><button data-gen="24">专家</button>
        </div>
        <div class="tip">出题保证唯一解，已知数字越少越难；生成后自动开始逐步推理。</div>
      </div>
    </div>

    <div class="card">
      <h2>显示选项</h2>
      <div class="body chk">
        <label><input type="checkbox" id="cCands"> 显示候选数</label>
        <label><input type="checkbox" id="cElims" checked> 列出排除步骤</label>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="card"><h2>题目诊断</h2><div class="body" id="diag"></div></div>
    <div class="card"><h2>本步理由 <span id="rIdx" style="font-weight:400"></span></h2><div class="body" id="reason"></div></div>
    <div class="card">
      <h2>步骤 <span id="sCnt" style="font-weight:400"></span></h2>
      <div class="steps" id="steps"><div class="empty">先填入已知数字，点「求解」</div></div>
      <div class="hint">
        <kbd>1</kbd>–<kbd>9</kbd> 填数 · <kbd>0</kbd>/<kbd>Del</kbd> 清格 · <kbd>方向键</kbd> 移动 ·
        <kbd>Enter</kbd> 下一步 · <kbd>Backspace</kbd> 上一步 · <kbd>空格</kbd> 播放 ·
        <kbd>双击</kbd> 跳到该步
      </div>
    </div>
  </div>
</div>

<script src="dist/solver.js"></script>
<script src="dist/ui.js"></script>
</body>
</html>
